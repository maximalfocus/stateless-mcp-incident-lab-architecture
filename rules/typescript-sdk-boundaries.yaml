schema_version: 2
implementation: typescript-sdk
architecture: hexagonal
source_root: src
matching:
  from_glob: gitignore-style-globstar-over-source-path
  import_pattern: portable-ecmascript-python-regex-search-over-canonical-import
  module_pattern: gitignore-style-globstar-over-source-directory
  canonical_import: bare packages remain unchanged; relative and aliased imports resolve to workspace-root TypeScript source paths

deny:
  - id: domain-to-application
    from_glob: src/domain/**
    import_pattern: '^src/application(?:/|$)'
  - id: domain-to-adapters
    from_glob: src/domain/**
    import_pattern: '^src/adapters(?:/|$)'
  - id: domain-to-frameworks
    from_glob: src/domain/**
    import_pattern: '^(@modelcontextprotocol/sdk(?:/|$)|node:(?:http|https|http2|net|tls)$|(?:http|https)$|@aws-sdk/|aws-sdk(?:/|$)|undici(?:/|$)|express(?:/|$)|fastify(?:/|$))'
  - id: application-to-adapters
    from_glob: src/application/**
    import_pattern: '^src/adapters(?:/|$)'
  - id: application-to-frameworks
    from_glob: src/application/**
    import_pattern: '^(@modelcontextprotocol/sdk(?:/|$)|node:(?:http|https|http2|net|tls)$|(?:http|https)$|@aws-sdk/|aws-sdk(?:/|$)|undici(?:/|$)|express(?:/|$)|fastify(?:/|$))'
  - id: inbound-to-outbound-adapters
    from_glob: src/adapters/inbound/**
    import_pattern: '^src/adapters/outbound(?:/|$)'
  - id: outbound-to-inbound-adapters
    from_glob: src/adapters/outbound/**
    import_pattern: '^src/adapters/inbound(?:/|$)'

boundaries:
  - id: domain-public-api
    from_glob: src/**
    module_pattern: src/domain/*/
    allowed_entry: index.ts
    same_module: allow
  - id: application-public-api
    from_glob: src/**
    module_pattern: src/application/*/
    allowed_entry: index.ts
    same_module: allow
  - id: inbound-adapter-public-api
    from_glob: src/**
    module_pattern: src/adapters/inbound/*/
    allowed_entry: index.ts
    same_module: allow
  - id: outbound-adapter-public-api
    from_glob: src/**
    module_pattern: src/adapters/outbound/*/
    allowed_entry: index.ts
    same_module: allow
